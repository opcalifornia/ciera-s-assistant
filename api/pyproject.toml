[project]
name = "greenroom-api"
version = "0.1.0"
description = "GreenRoom AI front office API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic[email]>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "beanie>=1.26,<2.0",
  "motor>=3.5,<4.0",
  "redis>=5.0,<6.0",
  "arq>=0.26,<1.0",
  "anthropic>=0.34,<1.0",
  "voyageai>=0.2,<1.0",
  "pyjwt>=2.9,<3.0",
  "passlib[bcrypt]>=1.7,<2.0",
  "bcrypt==4.0.1",  # passlib 1.7.x doesn't support bcrypt>=4.1's API (see passlib#684)
  "python-multipart>=0.0.9",
  "httpx>=0.27,<1.0",
  "langfuse>=2.44,<3.0",
  "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "mongomock-motor>=0.0.24",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
  "types-passlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
